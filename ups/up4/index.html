function renderOffer(o){const next=document.body.dataset.next;document.title=`${o.title} · oferta2`;document.getElementById('app').innerHTML=shell(o.title,o.icon,'Um adicional opcional para complementar sua experiência.',`<section class="card intro"><span class="badge">ADICIONAL OPCIONAL</span><h2 style="font-size:clamp(24px,4vw,30px);line-height:1.2;letter-spacing:-.6px">${o.headline}</h2><p>${o.description}</p></section><section class="card"><div class="card-head">${svg('list')}<h2>Detalhes da opção</h2></div><div class="facts">${o.facts.map((v,i)=>`<div class="fact"><small>${['Serviço','Condição','Disponibilidade','Contratação'][i]}</small><strong>${v}</strong></div>`).join('')}<div class="fact full"><small>Sua escolha</small><strong>Você pode seguir sem adicionar este serviço.</strong></div></div></section><section class="card benefits"><h2>O que considerar na sua escolha</h2><ul class="benefit-list">${o.benefits.map(v=>`<li><span class="check" aria-hidden="true">✓</span><span>${v}</span></li>`).join('')}</ul></section><div class="compare"><section class="card"><h3>Manter o original</h3><ul>${o.standard.map(v=>`<li>· ${v}</li>`).join('')}</ul></section><section class="card enhanced"><h3>Com o adicional</h3><ul>${o.enhanced.map(v=>`<li>✓ ${v}</li>`).join('')}</ul></section></div><section class="card note"><h3>Condições da demonstração</h3><p>${o.note}</p></section><section class="card offer"><div class="eyebrow">${o.detail}</div><div class="price"><small>R$</small>${o.price}<sup>,${o.decimals}</sup></div><p class="price-label">Valor adicional simulado · Sem cobrança</p><p class="offer-copy">Você decide. A escolha será exibida no resumo para revisão.</p><button class="btn" id="accept">${o.action} — ${money(o.cents)} <span aria-hidden="true">→</span></button><button class="decline" id="decline">Continuar sem adicionar</button><p class="micro">A seleção neste protótipo não contrata o serviço.</p><div class="trust"><span>✓ Escolha opcional</span><span>✓ Resumo transparente</span><span>✓ Sem pagamento</span></div></section><h2 class="faq-title">Perguntas frequentes</h2>${o.faqs.map(([q,a])=>`<details class="card faq"><summary>${q}</summary><p>${a}</p></details>`).join('')}`,o.step);document.getElementById('accept').addEventListener('click',()=>{selections.add(page);location.href=url(next);});document.getElementById('decline').addEventListener('click',()=>{selections.delete(page);location.href=url(next);});}
function renderSummary(){document.title='Resumo da simulação · oferta2';const total=[...selections].reduce((n,id)=>n+offers[id].cents,0);document.getElementById('app').innerHTML=shell('Confira suas escolhas','list','Revise os adicionais antes de encerrar a demonstração.',`<section class="card summary-card"><span class="badge">RESUMO DA SIMULAÇÃO</span><h2>Somente o que você escolheu.</h2><p style="color:var(--muted);font-size:14px;margin-top:8px">O valor do produto original não está incluído neste resumo.</p><ul class="summary-list">${selections.size?[...selections].map(id=>`<li class="summary-row"><div><strong>${offers[id].title}</strong><small>Adicional opcional · Preço ilustrativo</small><button data-remove="${id}" aria-label="Remover ${offers[id].title}">Remover</button></div><strong>${money(offers[id].cents)}</strong></li>`).join(''):'<li class="empty">Nenhum adicional selecionado.</li>'}</ul><div class="summary-total"><span>Total dos adicionais</span><span>${money(total)}</span></div><button class="btn" id="finish">Concluir simulação <span aria-hidden="true">✓</span></button><a class="btn secondary" href="${url('ups/up1/index.html')}">Revisar opções</a><div id="finished" class="finish" role="status" hidden><h3>Simulação concluída.</h3><p>Suas escolhas foram revisadas. Nenhum pedido foi criado, nenhum serviço foi contratado e nenhum valor foi cobrado.</p></div></section><section class="card note"><h3>Antes de uma oferta real</h3><p>É necessário confirmar fornecedores, disponibilidade, preços e condições dos serviços. Este protótipo não possui integração com pedidos ou pagamentos.</p></section>`);document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{selections.delete(b.dataset.remove);history.replaceState(null,'',url('resumo/index.html'));renderSummary();}));document.getElementById('finish').addEventListener('click',()=>{document.getElementById('finished').hidden=false;document.getElementById('finish').disabled=true;document.getElementById('finish').textContent='Simulação concluída';});}
function renderHome(){document.getElementById('app').innerHTML=shell('Uma escolha melhor para cada etapa.','shield','Três ofertas opcionais, com condições claras.',`<section class="card intro"><span class="badge">PROTÓTIPO · OFERTA2</span><h2>Entrega, cuidado e proteção.</h2><p>Explore as páginas ou percorra a sequência completa. Os preços são ilustrativos e nenhuma contratação é realizada.</p></section><nav class="home-links" aria-label="Páginas do protótipo">${Object.entries(offers).map(([id,o])=>`<a href="${url(`ups/${id}/index.html`)}"><div><strong>0${o.step} · ${o.title}</strong><small>${o.detail} · ${money(o.cents)}</small></div><span aria-hidden="true">→</span></a>`).join('')}</nav><a class="btn" href="${url('ups/up1/index.html')}">Iniciar demonstração <span aria-hidden="true">→</span></a><a class="decline" style="text-align:center" href="${url('resumo/index.html')}">Ver resumo da simulação</a>`);}
if(offers[page])renderOffer(offers[page]);else if(page==='summary')renderSummary();else renderHome();
</script>
</body>
</html>
